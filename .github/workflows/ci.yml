name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy scipy scikit-learn joblib

      - name: Compilación
        run: python -m compileall -q app core scripts sports tests

      - name: Tests
        run: python -m pytest -q

      # Informativo: no bloquea si aparece un CVE sin parche.
      - name: Auditoría de dependencias
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on
