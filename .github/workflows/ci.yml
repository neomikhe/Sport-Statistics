name: ci

# Verifica que nada se rompe en cada push/PR: compila todo el código y corre la
# suite de tests. No toca la BD ni despliega; es una red de seguridad para que
# ningún cambio futuro (tuyo o de un colaborador) rompa el proyecto en silencio.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy scipy scikit-learn joblib

      - name: Compilación (chequeo de sintaxis de todo el repo)
        run: python -m compileall -q app core scripts sports tests

      - name: Tests
        run: python -m pytest -q
