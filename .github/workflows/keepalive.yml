name: keepalive

# Mantiene viva la base de datos en la nube (el tier gratis se PAUSA tras
# 7 dias de inactividad). Un SELECT trivial diario reinicia el reloj.
#
# Requisito: secret DB_URL en GitHub -> Settings -> Secrets and variables ->
# Actions, con la cadena de conexion PostgreSQL.

on:
  schedule:
    - cron: "17 6 * * *"   # cada dia a las 06:17 UTC
  workflow_dispatch: {}

permissions: {}   # este job no toca el repo: cero permisos sobre el token

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BD (SELECT 1)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Falta el secret DB_URL"; exit 1
          fi
          python -m pip install --quiet "psycopg2-binary>=2.9"
          python - <<'PY'
          import os, psycopg2
          url = os.environ["DB_URL"]
          if "sslmode=" not in url:
              url += ("&" if "?" in url else "?") + "sslmode=require"
          con = psycopg2.connect(url)
          cur = con.cursor()
          cur.execute("SELECT 1")
          print("keepalive OK:", cur.fetchone())
          con.close()
          PY
