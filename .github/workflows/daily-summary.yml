name: daily-summary

on:
  schedule:
    - cron: "0 6 * * *"   # 23:00 hora del Pacífico (UTC-7)
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enmascarar datos de conexión
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          p = urlparse(os.environ.get("DB_URL", ""))
          for v in {p.hostname, p.username, p.password, (p.path or "").lstrip("/")}:
              if v:
                  print(f"::add-mask::{v}")
          PY

      - name: Instalar dependencias
        run: pip install --quiet pandas sqlalchemy psycopg2-binary python-dotenv

      - name: Resumen del día y keep-alive de la BD
        env:
          DATABASE_URL: ${{ secrets.DB_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUMMARY_TZ: America/Mazatlan
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secret DB_URL"; exit 1
          fi
          python scripts/daily_summary.py
