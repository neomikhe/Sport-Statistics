# Sin secretos: se puede publicar. En local: --server.address 127.0.0.1

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[theme]
base = "dark"
primaryColor = "#c5f24a"
backgroundColor = "#07090d"
secondaryBackgroundColor = "#111822"
textColor = "#e9eef5"
linkColor = "#c5f24a"
linkUnderline = false
borderColor = "#1f2935"
dataframeBorderColor = "#19222d"
dataframeHeaderBackgroundColor = "#0e141c"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
baseFontSize = 15
font = "Schibsted Grotesk, sans-serif"
headingFont = "Big Shoulders Display, sans-serif"
codeFont = "Geist Mono, monospace"
headingFontWeights = [800, 700, 700, 600, 600, 600]
greenColor = "#35c46a"
redColor = "#e5484d"
yellowColor = "#f5b83d"
orangeColor = "#f0884a"
blueColor = "#4d9cf8"
violetColor = "#a58bf6"
grayColor = "#8a95a8"
# Paleta validada para daltonismo: fútbol, baloncesto, béisbol, tenis.
chartCategoricalColors = ["#1fae78", "#e8662a", "#3f8cf0", "#e0569a"]

# Fuentes servidas por la propia app (sin peticiones a Google).
[[theme.fontFaces]]
family = "Schibsted Grotesk"
url = "app/static/fonts/schibsted-grotesk-latin-ext.woff2"
weight = "400 700"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

